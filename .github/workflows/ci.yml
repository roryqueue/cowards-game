name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Private factory source and evaluation checks (no experimental runs)
        timeout-minutes: 5
        run: |
          ./node_modules/.bin/vitest run --maxWorkers=1 packages/strategy-lab/src/factory/contracts.test.ts packages/strategy-lab/src/factory/identity.test.ts packages/strategy-lab/src/factory/repository.test.ts packages/strategy-lab/src/factory/ledger.test.ts packages/strategy-lab/src/factory/admission.test.ts packages/strategy-lab/src/factory/fingerprint.test.ts packages/strategy-lab/src/factory/calibration-corpus.test.ts packages/strategy-lab/src/factory/calibration.test.ts packages/strategy-lab/src/factory/intake-protocol.test.ts packages/strategy-lab/src/factory/intake.test.ts packages/strategy-lab/src/factory/supervision-artifacts.test.ts packages/strategy-oracle-tactical/src/tactical.test.ts packages/strategy-oracle-teacher/src/teacher.test.ts packages/strategy-oracle-model/src/model.test.ts scripts/ingest-v1-38-factory-packet.test.ts scripts/prepare-v1-38-factory-calibration.test.ts scripts/run-v1-38-factory-calibration.test.ts scripts/lib/v1-38-factory-supervised-runtime.test.ts scripts/check-v1-38-factory-boundaries.test.ts
          ./node_modules/.bin/tsx scripts/check-v1-38-factory-boundaries.ts
      - name: Phase 265 private league source gate (no allocation or experimental run)
        timeout-minutes: 30
        run: |
          ./node_modules/.bin/vitest run --maxWorkers=1 packages/strategy-lab/src/league/contracts.test.ts packages/strategy-lab/src/league/identity.test.ts packages/strategy-lab/src/league/matrix.test.ts packages/strategy-lab/src/league/solver.test.ts packages/strategy-lab/src/league/repository.test.ts packages/strategy-lab/src/league/connected-runner.test.ts packages/strategy-lab/src/league/psro.test.ts packages/strategy-lab/src/league/selection.test.ts packages/strategy-lab/src/league/red-team.test.ts packages/strategy-lab/src/league/report.test.ts packages/strategy-lab/src/league/fixtures.test.ts packages/strategy-lab/src/league/integration.test.ts scripts/run-v1-38-serious-league.test.ts scripts/check-v1-38-serious-league-boundaries.test.ts scripts/check-v1-38-lab-boundaries.test.ts scripts/check-v1-38-factory-boundaries.test.ts packages/strategy-lab/src/runtime-bridge.test.ts packages/strategy-lab/src/runner-invariance.test.ts packages/strategy-lab/src/factory/repository.test.ts packages/strategy-lab/src/factory/fingerprint.test.ts packages/strategy-lab/src/factory/admission.test.ts packages/strategy-lab/src/factory/supervision-artifacts.test.ts scripts/lib/v1-38-factory-supervised-runtime.test.ts packages/strategy-lab/src/league/allocation.test.ts scripts/lib/v1-38-league-authoring.test.ts scripts/lib/v1-38-league-response-runtime.test.ts scripts/assess-v1-38-factory-independence.test.ts scripts/v1-38-factory-execution-evidence.test.ts scripts/v1-38-factory-assessment-correction.test.ts
          ./node_modules/.bin/tsc -b packages/strategy-lab/tsconfig.json --pretty false
          ./node_modules/.bin/tsc --ignoreConfig --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --types node --skipLibCheck scripts/run-v1-38-serious-league.ts scripts/run-v1-38-serious-league.test.ts scripts/lib/v1-38-league-authoring.ts scripts/lib/v1-38-league-authoring.test.ts scripts/lib/v1-38-league-response-runtime.ts scripts/lib/v1-38-league-response-runtime.test.ts scripts/assess-v1-38-factory-independence.ts scripts/assess-v1-38-factory-independence.test.ts scripts/v1-38-factory-execution-evidence.ts scripts/v1-38-factory-execution-evidence.test.ts scripts/v1-38-factory-assessment-correction.ts scripts/v1-38-factory-assessment-correction.test.ts scripts/check-v1-38-serious-league-boundaries.ts scripts/check-v1-38-serious-league-boundaries.test.ts
          ./node_modules/.bin/tsx scripts/check-v1-38-serious-league-boundaries.ts
          ./node_modules/.bin/tsx scripts/check-v1-38-lab-boundaries.ts
          ./node_modules/.bin/tsx scripts/check-v1-38-factory-boundaries.ts
          pnpm exec tsx scripts/check-service-boundary-imports.ts
      - run: pnpm test:fast

  service-e2e:
    name: Service-backed E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cowards
          POSTGRES_PASSWORD: cowards
          POSTGRES_DB: cowards_game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cowards -d cowards_game"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cowards:cowards@localhost:5432/cowards_game
      REDIS_URL: redis://localhost:6379
      COWARDS_RUNTIME_SERVICE_URL: http://127.0.0.1:3107
      COWARDS_PROVIDER_VALIDATION_SECRET: cowards-provider-validation-ci-secret-v1.33
      STRATEGY_EXECUTION_ADAPTER: worker-thread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm preflight -- --skip-web
      - name: Start runtime service
        run: |
          pnpm --filter @cowards/runtime-service start > /tmp/cowards-runtime-service.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3107/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cowards-runtime-service.log
          exit 1
      - run: pnpm e2e:service

  visual-e2e:
    name: Replay visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:visual
